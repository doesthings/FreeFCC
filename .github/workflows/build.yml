name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble release
        run: ./gradlew assembleRelease --no-daemon

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: release-unsigned-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  signed-release:
    # Runs on a version tag push (v*) to sign + publish a release, or manually.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      # NOTE: runner.temp is NOT available in job-level env (only at step level),
      # and using it here made the whole workflow file invalid — every run,
      # including push/PR builds, failed at startup with 0 jobs created. Use
      # github.workspace, which IS available in job-level env.
      SIGNING_STORE_FILE: ${{ github.workspace }}/release.jks
      SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check signing secrets are present
        id: secrets
        run: |
          if [ -z "$SIGNING_KEYSTORE_B64" ] || [ -z "$SIGNING_STORE_PASSWORD" ] || [ -z "$SIGNING_KEY_ALIAS" ] || [ -z "$SIGNING_KEY_PASSWORD" ]; then
            echo "have_secrets=false" >> "$GITHUB_OUTPUT"
            echo "Warning: signing secrets not configured — skipping signed build." >&2
          else
            echo "have_secrets=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode keystore
        if: steps.secrets.outputs.have_secrets == 'true'
        run: echo "$SIGNING_KEYSTORE_B64" | base64 --decode > "$SIGNING_STORE_FILE"

      - name: Assemble signed release
        if: steps.secrets.outputs.have_secrets == 'true'
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload signed APK
        if: steps.secrets.outputs.have_secrets == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-signed-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # On a version tag, attach the signed APK to the GitHub Release.
      # The signed build output is named app-release.apk, so the stable URL
      # https://github.com/doesthings/FreeFCC/releases/latest/download/app-release.apk
      # (used by the site and the in-app updater) keeps working automatically.
      - name: Publish signed APK to the release
        if: startsWith(github.ref, 'refs/tags/v') && steps.secrets.outputs.have_secrets == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then APK="$(ls app/build/outputs/apk/release/*.apk | head -1)"; fi
          echo "Publishing $APK to release ${GITHUB_REF_NAME}"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "$APK" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "$APK" \
              --title "${GITHUB_REF_NAME}" --generate-notes
          fi